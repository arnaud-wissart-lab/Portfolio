name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  self-hosted-runner-diagnostics:
    if: github.event_name == 'pull_request' && github.head_ref == 'chore/dependabot-github-actions'
    runs-on:
      - self-hosted
      - linux

    steps:
      - name: Runner diagnostics
        run: |
          echo "Kernel: $(uname -a)"
          echo "Runner diagnostics completed."
